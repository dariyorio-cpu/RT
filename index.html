<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>SI-RT/RW Digital — Jimpitan Warga RT (Versi Vercel)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #edf1ef;
        --surface: #ffffff;
        --surface2: #e4ebe8;
        --text: #14231e;
        --dim: #5b6f66;
        --border: #d2ddd7;
        --accent: #0a5c46;
        --accent-dark: #074433;
        --accent-ink: #074433;
        --accent-soft: rgba(10, 92, 70, 0.09);
        --accent-text: #ffffff;
        --gold: #b8862f;
        --gold-bright: #d9a83f;
        --grad-a: #074433;
        --grad-b: #12916c;
        --amber: #86610d;
        --amber-bg: #faf0d3;
        --danger: #b3261e;
        --danger-solid-text: #ffffff;
        --danger-bg: #fae9e7;
        --green: #177245;
        --green-bg: #e1f2e7;
        --ring: rgba(10, 92, 70, 0.18);
        --shadow: 0 1px 2px rgba(9, 38, 27, 0.05), 0 6px 18px rgba(9, 38, 27, 0.06);
        --shadow-lg: 0 16px 40px rgba(6, 36, 25, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0f0d;
          --surface: #141c17;
          --surface2: #202b24;
          --text: #e8f0ea;
          --dim: #9db3a7;
          --border: #2b3a31;
          --accent: #45c08d;
          --accent-dark: #2ea878;
          --accent-ink: #7fd8b4;
          --accent-soft: rgba(69, 192, 141, 0.13);
          --accent-text: #03231a;
          --gold: #d9a83f;
          --gold-bright: #eec25e;
          --grad-a: #2ea878;
          --grad-b: #63d6a6;
          --amber: #eec25e;
          --amber-bg: #33290d;
          --danger: #ff9d94;
          --danger-solid-text: #3a0d08;
          --danger-bg: #3a1713;
          --green: #5cc98f;
          --green-bg: #10301f;
          --ring: rgba(69, 192, 141, 0.25);
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
          --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: var(--accent); color: var(--accent-text); }
      button, [role="button"], select, summary,
      input:not([type="checkbox"], [type="radio"]), a.btn {
        min-height: 2.25rem;
      }
      button { font-family: inherit; cursor: pointer; }
      input, select { font-family: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .num { font-variant-numeric: tabular-nums; }
      .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1rem; }

      /* ---------- Navbar atas ---------- */
      header.top {
        position: sticky; top: 0; z-index: 30;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 1px 0 rgba(9, 38, 27, 0.03), 0 8px 24px rgba(9, 38, 27, 0.05);
        padding-top: env(safe-area-inset-top);
      }
      .top-row {
        display: flex; flex-wrap: wrap; align-items: center;
        justify-content: space-between; gap: 0.5rem; padding: 0.625rem 0;
      }
      .brand { display: flex; align-items: center; gap: 0.625rem; min-width: 0; }
      .brand-mark {
        width: 2.5rem; height: 2.5rem; flex: none; border-radius: 0.75rem;
        background: linear-gradient(135deg, #0e7a5a 0%, var(--accent) 55%, var(--accent-dark) 100%);
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(217, 168, 63, 0.5), 0 4px 10px rgba(7, 68, 51, 0.3);
        display: flex; align-items: center; justify-content: center;
      }
      .brand-mark svg { width: 22px; height: 22px; }
      .app-name { font-size: 1.0625rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; margin: 0; color: var(--accent-ink); }
      .app-sub { font-size: 0.75rem; color: var(--dim); margin: 0; }
      .role-note { font-size: 0.75rem; color: var(--dim); margin: 0; padding-bottom: 0.5rem; }
      .role-group {
        display: flex; border: 1px solid var(--border); border-radius: 0.625rem;
        background: var(--surface2); padding: 0.25rem; gap: 0.125rem;
      }
      .role-group button {
        border: 0; background: transparent; color: var(--dim);
        border-radius: 0.5rem; padding: 0.375rem 0.75rem;
        font-size: 0.875rem; font-weight: 600; min-height: 2.25rem;
      }
      .role-group button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); box-shadow: var(--shadow); }

      nav.tabs-desktop { display: none; gap: 0.25rem; padding-bottom: 0.5rem; flex-wrap: wrap; }
      @media (min-width: 640px) and (max-width: 991.98px) { nav.tabs-desktop { display: flex; } }
      nav.tabs-desktop button {
        position: relative; border: 0; border-radius: 999px;
        padding: 0.5rem 0.875rem; font-size: 0.875rem; font-weight: 600;
        background: transparent; color: var(--dim);
        transition: background 0.15s ease, color 0.15s ease;
      }
      nav.tabs-desktop button:hover { background: var(--accent-soft); color: var(--accent-ink); }
      nav.tabs-desktop button[aria-current="page"] { background: var(--accent); color: var(--accent-text); box-shadow: 0 4px 10px rgba(7, 68, 51, 0.25); }
      /* Bilah navigasi atas tampilan publik (Warga): tautan jangkar ke bagian Beranda. */
      .public-nav { display: flex; gap: 0.375rem; overflow-x: auto; padding: 0.25rem 0 0.625rem; scrollbar-width: none; }
      .public-nav::-webkit-scrollbar { display: none; }
      .public-nav a {
        flex: none; padding: 0.375rem 0.875rem; border-radius: 999px;
        border: 1px solid var(--border); background: var(--surface);
        color: var(--text); font-size: 0.8125rem; font-weight: 700; text-decoration: none;
      }
      .public-nav a:hover { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
      .pill-count {
        position: absolute; top: -0.25rem; right: -0.25rem;
        background: var(--danger); color: #fff; border-radius: 999px;
        padding: 0 0.375rem; font-size: 11px; font-weight: 800; line-height: 1.4;
        box-shadow: 0 0 0 2px var(--surface);
      }
      @media (prefers-color-scheme: dark) { .pill-count { color: #3a0d08; } }

      nav.tabs-mobile {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        background: var(--surface); border-top: 1px solid var(--border);
        box-shadow: 0 -8px 24px rgba(9, 38, 27, 0.08);
        padding-bottom: env(safe-area-inset-bottom);
      }
      @media (min-width: 640px) { nav.tabs-mobile { display: none; } }
      nav.tabs-mobile .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
      .subtabs { display: flex; flex-wrap: wrap; gap: 0.375rem; }
      .subtabs button {
        border: 1px solid var(--border); background: var(--surface); color: var(--dim);
        border-radius: 999px; padding: 0.375rem 0.75rem; font-size: 0.8125rem; font-weight: 600;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .subtabs button:hover { border-color: var(--accent); color: var(--accent-ink); }
      .subtabs button[aria-current="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
      nav.tabs-mobile button {
        position: relative; border: 0; background: transparent;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 0.5rem 0.125rem; font-size: 11px; font-weight: 600; color: var(--dim);
        min-height: 3rem;
      }
      nav.tabs-mobile button[aria-current="page"] { color: var(--accent-ink); font-weight: 800; }
      nav.tabs-mobile svg { width: 20px; height: 20px; }
      nav.tabs-mobile .pill-count { top: 2px; right: calc(50% - 22px); }

      /* ---------- Layout dengan sidebar admin (desktop) ---------- */
      .layout { display: block; }
      @media (min-width: 992px) { .layout.noside { grid-template-columns: minmax(0, 1fr); } }
      aside.sidebar { display: none; }
      @media (min-width: 992px) {
        .layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 1.5rem; align-items: start; }
        aside.sidebar {
          display: block; position: sticky; top: 5.5rem;
          background: var(--surface); border: 1px solid var(--border);
          border-radius: 1rem; box-shadow: var(--shadow); padding: 0.75rem;
        }
        aside.sidebar .side-title {
          font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em;
          text-transform: uppercase; color: var(--dim); margin: 0.25rem 0.5rem 0.5rem;
        }
        aside.sidebar button {
          position: relative; display: flex; align-items: center; gap: 0.625rem;
          width: 100%; border: 0; background: transparent; color: var(--text);
          border-radius: 0.625rem; padding: 0.5rem 0.625rem; font-size: 0.875rem; font-weight: 500;
          text-align: left; min-height: 2.5rem;
          transition: background 0.15s ease, color 0.15s ease;
        }
        aside.sidebar button svg { width: 18px; height: 18px; flex: none; color: var(--dim); }
        aside.sidebar button:hover { background: var(--accent-soft); }
        aside.sidebar button[aria-current="page"] {
          background: var(--accent-soft); color: var(--accent-ink); font-weight: 700;
          box-shadow: inset 3px 0 0 var(--gold);
        }
        aside.sidebar button[aria-current="page"] svg { color: var(--accent-ink); }
        aside.sidebar .pill-count { top: 0.375rem; right: 0.375rem; }
        aside.sidebar hr { border: 0; border-top: 1px solid var(--border); margin: 0.5rem 0; }
      }

      main { padding: 1.25rem 0 6rem; min-width: 0; }
      @media (min-width: 640px) { main { padding-bottom: 2.5rem; } }
      .stack > * + * { margin-top: 1.25rem; }
      .stack-lg > * + * { margin-top: 2rem; }

      /* ---------- Komponen ---------- */
      h2.sec { font-size: 1.0625rem; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
      .sub { font-size: 0.875rem; color: var(--dim); margin: 0.25rem 0 0; }
      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 0.875rem; padding: 1rem; box-shadow: var(--shadow);
      }
      .card-lg { border-radius: 1.125rem; padding: 1.5rem; }
      .empty {
        border: 1px dashed var(--border); border-radius: 0.875rem;
        background: var(--surface); padding: 1.25rem 1rem;
        text-align: center; font-size: 0.875rem; color: var(--dim); margin: 0;
      }
      .notice-amber {
        background: var(--amber-bg); border: 1px solid var(--border);
        border-radius: 0.875rem; padding: 1rem;
      }
      .err {
        background: var(--danger-bg); color: var(--danger);
        border-radius: 0.625rem; padding: 0.75rem 1rem;
        font-size: 0.875rem; font-weight: 600; margin: 0;
      }
      @media (prefers-color-scheme: dark) { .err { color: var(--text); } }
      .badge {
        display: inline-flex; align-items: center; border-radius: 999px;
        padding: 0.2rem 0.6rem; font-size: 0.75rem; font-weight: 700;
      }
      .badge-green { background: var(--green-bg); color: var(--green); }
      .badge-amber { background: var(--amber-bg); color: var(--amber); }
      .badge-gray { background: var(--surface2); color: var(--dim); }
      .badge-red { background: var(--danger-bg); color: var(--danger); }

      .btn {
        border-radius: 0.625rem; padding: 0.5rem 1rem;
        font-size: 0.875rem; font-weight: 700; border: 1px solid transparent;
        display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
        text-decoration: none;
        transition: filter 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      .btn-primary {
        background: linear-gradient(180deg, var(--grad-b), var(--accent) 55%, var(--grad-a));
        color: #ffffff; border-color: var(--accent-dark);
        box-shadow: 0 4px 12px rgba(7, 68, 51, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }
      @media (prefers-color-scheme: dark) { .btn-primary { color: #03231a; } }
      .btn-primary:hover { filter: brightness(1.07); }
      .btn-amber {
        background: linear-gradient(180deg, #e3ac40, #c08c26); color: #2a1e05; border-color: #a87c1f;
        box-shadow: 0 4px 12px rgba(150, 105, 20, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .btn-amber:hover { filter: brightness(1.05); }
      .btn-ghost {
        background: var(--surface); color: var(--accent-ink);
        border: 1px solid var(--accent); font-weight: 700;
      }
      .btn-ghost:hover { background: var(--accent-soft); }
      .btn-danger { background: var(--danger); color: var(--danger-solid-text); border-color: var(--danger); }
      .btn-danger-ghost {
        background: var(--surface); color: var(--danger);
        border: 1px solid var(--danger); font-weight: 700;
      }
      .btn-danger-ghost:hover { background: var(--danger-bg); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .link-danger { color: var(--danger); font-size: 0.75rem; font-weight: 700; text-decoration: underline; background: none; border: 0; padding: 0.25rem; min-height: 2rem; }

      label.lbl { display: block; font-size: 0.875rem; font-weight: 700; margin-bottom: 0.25rem; }
      .inp {
        width: 100%; border-radius: 0.625rem; border: 1px solid var(--border);
        background: var(--surface); color: var(--text);
        padding: 0.5rem 0.75rem; font-size: 1rem; outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 0.22rem var(--ring); }
      .hint { font-size: 0.75rem; color: var(--dim); margin-top: 0.25rem; }
      .field-err { font-size: 0.875rem; font-weight: 600; color: var(--danger); margin-top: 0.25rem; }
      .ok-note { font-size: 0.875rem; font-weight: 700; color: var(--green); }

      .grid2 { display: grid; gap: 0.75rem; }
      @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      @media (min-width: 1024px) { .stats { grid-template-columns: repeat(4, 1fr); } }
      .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
      .stat .lab {
        font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em;
        text-transform: uppercase; color: var(--dim); margin: 0;
      }
      .stat .val { font-size: 1.375rem; font-weight: 800; letter-spacing: -0.02em; margin: 0.25rem 0 0; }
      .stat .val.amber { color: var(--amber); }
      .stat .ic {
        width: 2.25rem; height: 2.25rem; border-radius: 0.625rem; margin-bottom: 0.5rem;
        background: var(--accent-soft); color: var(--accent-ink);
        display: flex; align-items: center; justify-content: center;
      }
      .stat .ic svg { width: 20px; height: 20px; }

      /* ---------- Hero halaman depan publik ---------- */
      .hero {
        background: linear-gradient(140deg, #0d7a5a 0%, #0a5c46 45%, #052e22 100%);
        color: #fff;
        border: 1px solid rgba(217, 168, 63, 0.35);
        border-radius: 1.25rem; padding: 2rem 1.25rem; text-align: center;
        box-shadow: var(--shadow-lg);
      }
      @media (min-width: 768px) { .hero { padding: 3rem 2.5rem; } }
      .hero .kicker {
        display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em;
        text-transform: uppercase; background: rgba(217, 168, 63, 0.18); color: #f0cd7e;
        border: 1px solid rgba(217, 168, 63, 0.4);
        border-radius: 999px; padding: 0.25rem 0.75rem; margin: 0;
      }
      .hero h1 {
        font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2;
        margin: 1rem auto 0; max-width: 42rem;
      }
      @media (min-width: 768px) { .hero h1 { font-size: 2.5rem; } }
      .hero .lead { font-size: 1rem; opacity: 0.92; margin: 0.75rem auto 0; max-width: 36rem; }
      .hero .cta { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1.5rem; }
      .hero .btn-light {
        background: #fff; color: var(--accent-dark); border: 1px solid #fff;
        box-shadow: 0 6px 16px rgba(3, 30, 20, 0.3);
      }
      .hero .btn-outline-light { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.85); }
      .hero .btn-outline-light:hover { background: rgba(255, 255, 255, 0.12); }
      .hero .lab { font-size: 0.875rem; font-weight: 600; opacity: 0.85; margin: 0; }
      .hero .big { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.02em; margin: 0.5rem 0 0; line-height: 1.1; }
      .hero .sub2 { font-size: 0.875rem; opacity: 0.85; margin: 0.25rem 0 0; }
      .progress { height: 0.625rem; border-radius: 999px; background: rgba(0,0,0,0.25); overflow: hidden; margin-top: 1rem; }
      .progress > div { height: 100%; border-radius: 999px; background: #fff; transition: width 0.3s; }
      .hero .btn-hero {
        margin-top: 1rem; background: #fff; color: var(--accent-dark);
        border: 0; border-radius: 0.625rem; padding: 0.5rem 1rem; font-weight: 700; font-size: 0.875rem;
        box-shadow: 0 6px 16px rgba(3, 30, 20, 0.3);
      }

      /* Kartu progres keliling hari ini */
      .today-card { text-align: left; }
      .today-card .big { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin: 0.25rem 0 0; line-height: 1.1; color: var(--accent-ink); }
      .today-card .progress { background: var(--surface2); }
      .today-card .progress > div { background: linear-gradient(90deg, var(--grad-a), var(--grad-b)); }

      /* Transparansi keuangan: saldo besar di tengah */
      .saldo { text-align: center; }
      .saldo .lab {
        font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em;
        text-transform: uppercase; color: var(--dim); margin: 0;
      }
      .saldo .big { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.02em; margin: 0.25rem 0 0; color: var(--accent-ink); }
      @media (min-width: 768px) { .saldo .big { font-size: 3rem; } }
      .saldo-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1rem; text-align: center; }
      .saldo-cols .v { font-size: 1.125rem; font-weight: 800; margin: 0; }
      .saldo-cols .l { font-size: 0.75rem; color: var(--dim); margin: 0; }

      /* Layanan Cepat */
      .layanan { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      @media (min-width: 768px) { .layanan { grid-template-columns: repeat(3, 1fr); } }
      .layanan button {
        display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem;
        background: var(--surface); border: 1px solid var(--border); border-radius: 0.875rem;
        box-shadow: var(--shadow); padding: 1rem; text-align: left; color: var(--text);
        font-size: 0.9375rem; font-weight: 700; min-height: 5.5rem;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .layanan button:hover { border-color: var(--accent); transform: translateY(-2px); }
      .layanan button .d { font-size: 0.8125rem; font-weight: 400; color: var(--dim); }
      .layanan .ic {
        width: 2.5rem; height: 2.5rem; border-radius: 0.625rem;
        background: var(--accent-soft); color: var(--accent-ink);
        display: flex; align-items: center; justify-content: center;
      }
      .layanan .ic svg { width: 22px; height: 22px; }

      .sec-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
      .sec-head .ic {
        width: 2rem; height: 2rem; border-radius: 0.5rem; flex: none;
        background: var(--accent-soft); color: var(--accent-ink);
        display: flex; align-items: center; justify-content: center;
      }
      .sec-head .ic svg { width: 18px; height: 18px; }
      .sec-head h2 { font-size: 1.0625rem; font-weight: 800; letter-spacing: -0.01em; margin: 0; }

      .row-item {
        display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 0.75rem; padding: 0.75rem 1rem; box-shadow: var(--shadow);
      }
      .row-item .t { font-size: 0.875rem; font-weight: 700; margin: 0; }
      .row-item .s { font-size: 0.75rem; color: var(--dim); margin: 0; }
      .row-item .amt { font-size: 0.875rem; font-weight: 800; text-align: right; margin: 0; white-space: nowrap; }
      .row-item .amt-sub { font-size: 0.75rem; font-weight: 600; color: var(--amber); text-align: right; margin: 0; }
      .strike { color: var(--dim); text-decoration: line-through; }
      .list > * + * { margin-top: 0.5rem; }
      .actions-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
      .badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
      .inline-form {
        margin-top: 0.75rem; background: var(--surface2);
        border-radius: 0.75rem; padding: 0.75rem;
      }
      .banner-btn {
        display: flex; width: 100%; align-items: center; justify-content: space-between;
        background: var(--amber-bg); border: 1px solid var(--border); border-radius: 0.875rem;

  <body>
    <div id="app"></div>
    <script>
      "use strict";

      /* ================= Util ================= */
      var rp = function (n) { return "Rp" + new Intl.NumberFormat("id-ID").format(n); };
      function pad(n) { return String(n).padStart(2, "0"); }
      function todayStr() {
        var d = new Date();
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }
      function monthStr() { return todayStr().slice(0, 7); }
      function shiftDate(iso, days) {
        var d = new Date(iso + "T00:00:00");
        d.setDate(d.getDate() + days);
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }
      function fmtTanggal(iso) {
        return new Intl.DateTimeFormat("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date(iso + "T00:00:00"));
      }
      function fmtSingkat(iso) {
        return new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "short" }).format(new Date(iso + "T00:00:00"));
      }
      function fmtBulan(ym) {
        return new Intl.DateTimeFormat("id-ID", { month: "long", year: "numeric" }).format(new Date(ym + "-01T00:00:00"));
      }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function downloadFile(name, content, type) {
        var blob = new Blob([content], { type: type || "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 500);
      }

      /* ================= State (tersimpan di perangkat ini) ================= */
      var state = {
        tab: "beranda",
        role: "warga",             /* warga (publik, hanya lihat) | petugas | bendahara | admin | superadmin — peran pengurus terkunci PIN */
        nama: "",
        userId: null,              /* id pengguna bernama (menu Users) bila masuk lewat akun pengguna; null bila masuk lewat akun bawaan peran */
        pins: { petugas: "", bendahara: "", superadmin: "" }, /* Kosong di file yang dibagikan — PIN dibuat pemilik saat penyiapan pertama, tidak pernah tertulis di kode */
        users: [],                 /* [{id, nama, peran, pin, hp, aktif, dibuat}] — pengguna tambahan (Admin/Bendahara/Petugas/Warga), ditambah Super Admin di menu Users; tidak ada pengguna bawaan di file */
        settings: {
          namaRt: "RT Kami", wilayah: "", nominalBaku: 500, nominalIuran: 20000,
          saldoAwal: { utama: 0, proyek: 0, kematian: 0 },   /* saldo awal per kas — diisi di Pengaturan */
          rtList: [],                /* dukungan RW: [{nama, nominalJimpitan, nominalIuran}] — tiap RT bisa beda iuran */
          pengurus: []               /* [{nama, jabatan, noHp, foto}] — tampil di halaman depan */
        },
        houses: [],                /* {id, nomor, namaPenghuni, blok, status, catatan} */
        collections: [],           /* {id, houseId, tanggal, total, jimpitan, kelebihan, petugas, status, diverifikasiOleh, alasanBatal} */
        expenses: [],              /* {id, tanggal, keperluan, jumlah, dicatatOleh, keterangan, status, alasanBatal} */
        warga: [],                 /* {id, nama, alamat, noHp, status} — data KK untuk iuran bulanan */
        iuran: [],                 /* {id, wargaId, bulan, jumlah, status, tanggalBayar} — ceklis per bulan */
        aset: [],                  /* {id, nama, jumlah, kondisi, lokasi} */
        surat: [],                 /* {id, namaPemohon, jenis, keperluan, tanggal, status, catatan} */
        pinjam: [],                /* {id, asetId, peminjam, tanggalPinjam, tanggalKembali, status} */
        aduan: [],                 /* {id, nama, isi, tanggal, status} */
        agenda: [],                /* {id, judul, tanggal, lokasi, keterangan} */
        umum: [],                  /* {id, judul, isi, tanggal} — pengumuman */
        umkm: [],                  /* {id, namaUsaha, pemilik, kategori, kontak, deskripsi, status, alasanBatal} */
        profil: [],                /* {id, houseId, noKK, nik, nama, hubungan, pekerjaan, pendidikan, golonganDarah, tanggalLahir, agama, statusKawin, noHp, statusTinggal, riwayat:[{status,tanggal,alasan,oleh}]} */
        broadcast: [],             /* {id, tanggal, judul, pesan, oleh, penerima} — log broadcast WA */
        bayar: [],                 /* {id, wargaId, bulan, jumlah, buktiNama, keterangan, tanggal, status} — pembayaran iuran mandiri warga, menunggu verifikasi bendahara */
        audit: [],                 /* {id, waktu, peran, nama, aksi} */
        seq: 1
      };
      /* State tampilan sesaat (form terbuka, tanggal yang dilihat, dst.) */
      var ui = {
        tanggal: todayStr(),
        bulan: monthStr(),
        customFor: null, customVal: "",
        voidFor: null, voidReason: "",
        voidExpFor: null, voidExpReason: "",
        error: "", namaError: "",
        houseForm: null,           /* null | {editingId} */
        fNomor: "", fPenghuni: "", fBlok: "", fStatus: "aktif", fCatatan: "", fError: "",
        cari: "",
        sNama: null, sWilayah: null, sNominal: null, sIuran: null, sError: "", sDone: false,
        eTgl: todayStr(), eKeperluan: "", eJumlah: "", eKet: "", eError: "",
        backupMsg: "",
        cloudToken: "", cloudMsg: "", cloudErr: "", cloudConfirm: false,
        rtSec: "warga",
        iuranBulan: monthStr(),
        rtError: "", rtDone: "",
        wNama: "", wAlamat: "", wHp: "",
        aNama: "", aJumlah: "1", aKondisi: "Baik", aLokasi: "",
        suNama: "", suJenis: "Domisili", suKeperluan: "",
        pjAset: "", pjNama: "", pjTgl: todayStr(),
        adNama: "", adIsi: "",
        agJudul: "", agTgl: todayStr(), agLokasi: "", agKet: "",
        umJudul: "", umIsi: "",
        ukNama: "", ukPemilik: "", ukKategori: "", ukKontak: "", ukDesk: "",
        loginOpen: false, loginRole: "petugas", loginUser: "", loginPin: "", loginNama: "", loginError: "",
        uNama: "", uPeran: "petugas", uPin: "", uPinConf: "", uHp: "", uError: "", uDone: false,
        userPinFor: null, userPinNew: "", userPinConf: "", userPinError: "", userPinDone: false,
        setupNama: "", setupSuper: "", setupBendahara: "", setupPetugas: "", setupError: "",
        pinPetugas: null, pinBendahara: null, pinSuper: null, pinError: "", pinDone: false,
        notifOpen: false,
        cariWarga: "", cariWargaRun: false,
        pfEdit: null, pfHouse: "", pfKK: "", pfNik: "", pfNama: "", pfHub: "Kepala Keluarga",
        pfPekerjaan: "", pfPendidikan: "", pfDarah: "", pfLahir: "", pfAgama: "", pfKawin: "",
        pfHp: "", pfStatus: "aktif", pfAlasan: "", pfCari: "", pfFilter: "semua",
        wEdit: null, wStatus: "aktif", wRt: "",
        aEdit: null, agEdit: null, umEdit: null, ukEdit: null,
        batalJenis: "", batalId: null, batalReason: "",
        bcJudul: "", bcPesan: "",
        myNama: "", myHp: "", myWargaId: null, myBulan: "", myJumlah: "", myBuktiNama: "", myKet: "", myMsg: "", myErr: "",
        rtNamaBaru: "", rtJimpBaru: "", rtIuranBaru: "",
        fRt: "",
        pgNama: "", pgJabatan: "", pgHp: "", pgFoto: "",
        sSaldoUtama: null, sSaldoProyek: null, sSaldoKematian: null,
        eKas: "utama",
        houseArsipFor: null, houseArsipReason: ""
      };

      /* ===== Penyimpanan perangkat: data, PIN, dan sesi masuk disimpan di browser
         perangkat ini, jadi refresh / menutup lalu membuka lagi halaman TIDAK
         mengulang penyiapan PIN dari awal. Sesi pengurus tetap aktif sampai
         tombol Keluar ditekan. Bila penyimpanan browser tidak tersedia
         (mode privat dsb.), aplikasi tetap berjalan dari memori seperti semula. ===== */
      var LS_KEY = "sirt-rw-vercel-v1";
      var LS_SESI_KEY = "sirt-rw-sesi-v1";
      var LS_FIELDS = ["settings", "pins", "users", "houses", "collections", "expenses", "warga", "iuran",
        "aset", "surat", "pinjam", "aduan", "agenda", "umum", "umkm", "audit", "profil", "broadcast", "bayar"];
      /* Uji sekali di awal: apakah browser mengizinkan penyimpanan persisten?
         Mode privat/incognito ("Samaran") dan browser yang memblokir penyimpanan
         membuat localStorage gagal/terhapus saat jendela ditutup — dalam kondisi
         itu sesi memang tidak bisa bertahan, dan pengguna diberi tahu alasannya
         di jendela masuk, bukan diam-diam diminta PIN lagi. */
      var storageOk = (function () {
        try {
          localStorage.setItem("__sirt_uji__", "1");
          localStorage.removeItem("__sirt_uji__");
          return true;
        } catch (e) { return false; }
      })();
      /* PIN + sesi masuk disimpan di kunci KECIL tersendiri, terpisah dari
         snapshot data besar. Snapshot data bisa gagal ditulis (mis. kuota
         penuh oleh foto pengurus) atau rusak — PIN dan sesi tidak boleh ikut
         hilang karenanya. Kunci ini ditulis ulang di setiap render, termasuk
         tepat setelah penyiapan PIN, login, ganti PIN, dan logout. */
      function simpanSesi() {
        try {
          localStorage.setItem(LS_SESI_KEY, JSON.stringify({
            pins: state.pins, users: state.users,
            sesi: { role: state.role, nama: state.nama, userId: state.userId || null }
          }));
        } catch (e) { /* penyimpanan tidak tersedia — sesi hanya di memori */ }
      }
      /* Pulihkan sesi masuk dari objek sesi tersimpan: akun pengguna bernama
         (menu Users) dikenali lewat userId, akun bawaan peran lewat PIN peran
         yang memang ada di perangkat ini. */
      function pulihkanSesi(sesi) {
        if (!sesi || !sesi.role) return;
        if (sesi.userId) {
          var u = null;
          (state.users || []).forEach(function (x) { if (String(x.id) === String(sesi.userId)) u = x; });
          if (u && u.aktif !== false) { state.role = u.peran; state.nama = u.nama; state.userId = u.id; }
          return;
        }
        if (sesi.role !== "warga" && state.pins[sesi.role]) {
          state.role = sesi.role;
          state.nama = String(sesi.nama || "");
          state.userId = null;
        }
      }
      function simpanPerangkat() {
        simpanSesi();
        try {
          var snap = { versi: 1, seq: state.seq, sesi: { role: state.role, nama: state.nama } };
          LS_FIELDS.forEach(function (k) { snap[k] = state[k]; });
          localStorage.setItem(LS_KEY, JSON.stringify(snap));
        } catch (e) { /* penyimpanan tidak tersedia — lanjut dari memori */ }
        jadwalkanCloudSave();
      }
      function muatPerangkat() {
        /* 1) Pulihkan PIN + sesi lebih dulu dari kunci sesi tersendiri, supaya
           snapshot data yang rusak/terlalu besar tidak menghanguskan PIN. */
        try {
          var rawS = localStorage.getItem(LS_SESI_KEY);
          if (rawS) {
            var ds = JSON.parse(rawS);
            if (ds && ds.pins) {
              ["petugas", "bendahara", "superadmin"].forEach(function (k) {
                if (ds.pins[k]) state.pins[k] = String(ds.pins[k]);
              });
            }
            if (ds && Array.isArray(ds.users)) state.users = ds.users;
            if (ds && ds.sesi) pulihkanSesi(ds.sesi);
          }
        } catch (e) { /* kunci sesi tidak terbaca — lanjut ke snapshot data */ }
        /* 2) Baru muat snapshot data besar (PIN/sesi di dalamnya hanya jadi
           cadangan bila kunci sesi belum ada). */
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (!raw) return;
          var d = JSON.parse(raw);
          if (!d || !Array.isArray(d.houses) || !Array.isArray(d.collections) || !Array.isArray(d.expenses) ||
              !d.settings || typeof d.settings !== "object") return;
          state.settings = {
            namaRt: String(d.settings.namaRt || "RT Kami"),
            wilayah: String(d.settings.wilayah || ""),
            nominalBaku: Math.max(100, Number(d.settings.nominalBaku) || 500),
            nominalIuran: Math.max(0, Number(d.settings.nominalIuran) || 20000),
            saldoAwal: {
              utama: Number((d.settings.saldoAwal || {}).utama) || 0,
              proyek: Number((d.settings.saldoAwal || {}).proyek) || 0,
              kematian: Number((d.settings.saldoAwal || {}).kematian) || 0
            },
            rtList: Array.isArray(d.settings.rtList) ? d.settings.rtList : [],
            pengurus: Array.isArray(d.settings.pengurus) ? d.settings.pengurus : []
          };
          if (d.pins) {
            ["petugas", "bendahara", "superadmin"].forEach(function (k) {
              if (d.pins[k]) state.pins[k] = String(d.pins[k]);
            });
          }
          state.houses = d.houses; state.collections = d.collections; state.expenses = d.expenses;
          ["users", "warga", "iuran", "aset", "surat", "pinjam", "aduan", "agenda", "umum", "umkm", "audit", "profil", "broadcast", "bayar"].forEach(function (k) {
            state[k] = Array.isArray(d[k]) ? d[k] : [];
          });
          state.seq = Number(d.seq) || (state.houses.length + state.collections.length + state.expenses.length + 1);
          /* Pulihkan sesi dari snapshot hanya bila kunci sesi tersendiri belum
             memulihkan sesi apa pun, dan hanya bila PIN peran itu memang ada
             di perangkat ini (atau akun pengguna bernama itu masih aktif). */
          if (state.role === "warga" && d.sesi) pulihkanSesi(d.sesi);
        } catch (e) { /* snapshot rusak/tidak terbaca — mulai dari keadaan awal */ }
      }

      /* ================= Sinkronisasi Cloud (Turso) =================
         Data bisa disinkronkan antarperangkat lewat database Turso (libSQL):
         seluruh state disimpan sebagai satu baris JSON di tabel sync_state
         di database Turso pemilik. Endpoint-nya adalah Vercel Serverless
         Function same-origin /api/sync (BUKAN Next.js) — kredensial Turso
         hanya ada di environment variable server dan tidak pernah sampai
         ke browser. Token sinkronisasi dan ID perangkat ini disimpan LOKAL
         per perangkat di kunci tersendiri dan TIDAK PERNAH ikut di dalam
         state yang disinkronkan. localStorage tetap cadangan utama: bila
         cloud gagal dihubungi (offline), aplikasi tetap berjalan dari data
         perangkat dan menyinkronkan lagi nanti — galat cloud tidak pernah
         menghapus data lokal. Konflik diselesaikan last-write-wins menurut
         updatedAt: perangkat yang kalah mengunduh data cloud.
         Migrasi: kunci localStorage tetap sirt-rw-cloud-v1; URL Web App
         lama yang tersimpan diabaikan, endpoint kini tetap /api/sync. */
      var LS_CLOUD_KEY = "sirt-rw-cloud-v1";
      var CLOUD_ENDPOINT = "/api/sync"; /* Vercel Serverless Function (Turso) — same-origin */
      var cloud = { url: CLOUD_ENDPOINT, token: "", deviceId: "", lastSyncAt: null, lastKnownUpdatedAt: null };
      var cloudState = "belum";        /* belum | proses | tersinkron | offline | galat */
      var cloudLastDevice = "";        /* deviceId perangkat terakhir yang mengubah data cloud */
      var cloudTimer = null;           /* timer debounce simpan otomatis */
      var cloudSaving = false;
      var cloudBootPending = false;    /* selama unduh awal berjalan, unggah otomatis ditahan */
      var cloudSuppressSave = false;   /* menerapkan data cloud tidak memicu unggah balik */
      var cloudLastSentStr = null;     /* payload yang isinya sama persis dengan cloud terakhir diketahui */
      var cloudPending = null;         /* jawaban load yang menunggu pilihan pengguna (modal) */

      function cloudTerhubung() { return !!cloud.token; }
      function simpanCloudCfg() {
        try { localStorage.setItem(LS_CLOUD_KEY, JSON.stringify(cloud)); } catch (e) { /* abaikan */ }
      }
      function muatCloudCfg() {
        try {
          var raw = localStorage.getItem(LS_CLOUD_KEY);
          if (raw) {
            var d = JSON.parse(raw);
            if (d && typeof d === "object") {
              cloud.url = CLOUD_ENDPOINT; /* URL Web App lama diabaikan */
              cloud.token = String(d.token || "");
              cloud.deviceId = String(d.deviceId || "");
              cloud.lastSyncAt = d.lastSyncAt || null;
              cloud.lastKnownUpdatedAt = d.lastKnownUpdatedAt || null;
            }
          }
        } catch (e) { /* pengaturan cloud rusak — mulai sebagai belum terhubung */ }
        if (!cloud.deviceId) {
          cloud.deviceId = "dev-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e9).toString(36);
          simpanCloudCfg();
        }
        if (cloudTerhubung()) cloudState = cloud.lastSyncAt ? "tersinkron" : "belum";
      }
      /* Payload yang dikirim ke cloud: seluruh LS_FIELDS + seq — sama seperti
         snapshot perangkat, TANPA sesi masuk dan TANPA pengaturan cloud. */
      function cloudPayloadFrom(src) {
        var p = { seq: Number(src.seq) || 1 };
        LS_FIELDS.forEach(function (k) { p[k] = src[k]; });
        return p;
      }
      function cloudPayload() { return cloudPayloadFrom(state); }
      function cloudJumlahBaris() {
        var n = 0;
        LS_FIELDS.forEach(function (k) { if (Array.isArray(state[k])) n += state[k].length; });
        return n;
      }
      function cloudAdaDataLokal() {
        if (state.pins.petugas || state.pins.bendahara || state.pins.superadmin) return true;
        return cloudJumlahBaris() > 0;
      }
      function cloudErrText(res) {
        var e = res && res.error;
        if (e === "unauthorized") return "Token ditolak server (unauthorized). Periksa kembali token yang diisi.";
        if (e === "bad_state") return "Server menolak data yang dikirim (bad_state).";
        if (e === "bad_updatedAt") return "Server menolak waktu simpan (bad_updatedAt).";
        if (e === "busy") return "Server sedang sibuk (busy). Coba lagi sebentar.";
        if (e === "server_error") return "Galat di server cloud" + (res && res.message ? ": " + res.message : "") + ".";
        return "Tidak dapat menghubungi server cloud.";
      }
      function cloudGet(action) {
        return fetch(CLOUD_ENDPOINT + "?action=" + action + "&token=" + encodeURIComponent(cloud.token), { method: "GET" })
          .then(function (r) { return r.json(); });
      }
      function fmtJam(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
      }
      function cloudPillText() {
        if (!cloudTerhubung()) return "Cloud: Belum terhubung";
        if (cloudState === "offline") return "Cloud: Offline";
        if (cloudState === "proses") return "Cloud: Menyinkron…";
        if (cloud.lastSyncAt) return "Cloud: Tersinkron " + fmtJam(cloud.lastSyncAt);
        return "Cloud: Terhubung";
      }
      function cloudPillTone() {
        if (!cloudTerhubung()) return "badge-gray";
        if (cloudState === "offline" || cloudState === "galat") return "badge-amber";
        return "badge-green";
      }
      /* Terapkan state dari cloud ke perangkat ini. Sesi masuk (peran + nama)
         perangkat ini dipertahankan apa adanya. PIN mengikuti cloud bila
         cloud punya PIN; PIN lokal dipertahankan bila cloud kosong. */
      function terapkanStateCloud(cs) {
        if (!cs || !Array.isArray(cs.houses) || !Array.isArray(cs.collections) || !Array.isArray(cs.expenses) ||
            !cs.settings || typeof cs.settings !== "object") return false;
        var keepRole = state.role, keepNama = state.nama;
        state.settings = {
          namaRt: String(cs.settings.namaRt || "RT Kami"),
          wilayah: String(cs.settings.wilayah || ""),
          nominalBaku: Math.max(100, Number(cs.settings.nominalBaku) || 500),
          nominalIuran: Math.max(0, Number(cs.settings.nominalIuran) || 20000),
          saldoAwal: {
            utama: Number((cs.settings.saldoAwal || {}).utama) || 0,
            proyek: Number((cs.settings.saldoAwal || {}).proyek) || 0,
            kematian: Number((cs.settings.saldoAwal || {}).kematian) || 0
          },
          rtList: Array.isArray(cs.settings.rtList) ? cs.settings.rtList : [],
          pengurus: Array.isArray(cs.settings.pengurus) ? cs.settings.pengurus : []
        };
        LS_FIELDS.forEach(function (k) {
          if (k === "settings" || k === "pins") return;
          state[k] = Array.isArray(cs[k]) ? cs[k] : [];
        });
        if (cs.pins) {
          ["petugas", "bendahara", "superadmin"].forEach(function (k) {
            if (cs.pins[k]) state.pins[k] = String(cs.pins[k]);
          });
        }
        state.seq = Number(cs.seq) || (state.houses.length + state.collections.length + state.expenses.length + 1);
        state.role = keepRole; state.nama = keepNama;
        cloudSuppressSave = true;
        simpanPerangkat();
        cloudSuppressSave = false;
        cloudLastSentStr = JSON.stringify(cloudPayload());
        return true;
      }
      /* Unduh dari cloud. Tanpa paksa: hanya diterapkan bila updatedAt cloud
         lebih baru dari yang terakhir diketahui perangkat ini. */
      function cloudLoad(opts) {
        opts = opts || {};
        if (!cloudTerhubung()) return Promise.resolve(false);
        cloudState = "proses";
        return cloudGet("load").then(function (res) {
          cloudBootPending = false;
          if (!res || !res.ok) {
            cloudState = "galat"; ui.cloudErr = cloudErrText(res); ui.cloudMsg = "";
            render(); return false;
          }
          if (res.deviceId) cloudLastDevice = String(res.deviceId);
          if (!res.exists) {
            cloudState = "tersinkron";
            cloud.lastSyncAt = new Date().toISOString(); simpanCloudCfg();
            ui.cloudMsg = "Cloud masih kosong — belum ada data tersimpan di Turso.";
            ui.cloudErr = ""; render(); return false;
          }
          cloudLastSentStr = JSON.stringify(cloudPayloadFrom(res.state));
          var lebihBaru = !!res.updatedAt && res.updatedAt > String(cloud.lastKnownUpdatedAt || "");
          if (lebihBaru || opts.force) {
            if (terapkanStateCloud(res.state)) {
              cloud.lastKnownUpdatedAt = res.updatedAt;
              cloud.lastSyncAt = new Date().toISOString(); simpanCloudCfg();
              cloudState = "tersinkron";
              ui.cloudMsg = "Data cloud lebih baru — sudah diunduh dan diterapkan ke perangkat ini.";
              ui.cloudErr = ""; render(); return true;
            }
            cloudState = "galat";
            ui.cloudErr = "Data dari cloud tidak valid — data perangkat ini tidak diubah.";
            ui.cloudMsg = ""; render(); return false;
          }
          cloud.lastKnownUpdatedAt = res.updatedAt;
          cloud.lastSyncAt = new Date().toISOString(); simpanCloudCfg();
          cloudState = "tersinkron";
          if (opts.manual) {
            ui.cloudMsg = "Data perangkat ini sudah sama dengan cloud — tidak ada yang lebih baru untuk diunduh.";
            ui.cloudErr = "";
          }
          render(); return false;
        }).catch(function () {
          cloudBootPending = false;
          cloudState = "offline";
          ui.cloudMsg = "Offline — data tersimpan di perangkat, akan disinkronkan nanti.";
          render(); return false;
        });
      }
      /* Unggah state perangkat ini ke cloud. Bila server menjawab conflict
         (data cloud lebih baru), perangkat ini mengunduh data cloud —
         bukan menimpanya. */
      function cloudSave() {
        if (!cloudTerhubung() || cloudSaving) return Promise.resolve(false);
        cloudSaving = true; cloudState = "proses";
        var payload = cloudPayload();
        var body = {
          token: cloud.token, action: "save",
          updatedAt: new Date().toISOString(), deviceId: cloud.deviceId, state: payload
        };
        return fetch(CLOUD_ENDPOINT, {
          method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body)
        }).then(function (r) { return r.json(); }).then(function (res) {
          cloudSaving = false;
          if (res && res.ok) {
            cloud.lastKnownUpdatedAt = res.updatedAt || body.updatedAt;
            cloud.lastSyncAt = new Date().toISOString(); simpanCloudCfg();
            cloudLastSentStr = JSON.stringify(payload);
            cloudLastDevice = cloud.deviceId;
            cloudState = "tersinkron";
            ui.cloudMsg = "Data perangkat ini tersimpan di cloud (Turso).";
            ui.cloudErr = ""; render(); return true;
          }
          if (res && res.error === "conflict") {
            ui.cloudMsg = "Data cloud lebih baru — diunduh.";
            ui.cloudErr = "";
            return cloudLoad({ force: true }).then(function (applied) {
              if (applied) { ui.cloudMsg = "Data cloud lebih baru — diunduh."; render(); }
              return false;
            });
          }
          cloudState = "galat"; ui.cloudErr = cloudErrText(res); ui.cloudMsg = "";
          render(); return false;
        }).catch(function () {
          cloudSaving = false;
          cloudState = "offline";
          ui.cloudMsg = "Offline — data tersimpan di perangkat, akan disinkronkan nanti.";
          render(); return false;
        });
      }
      /* Simpan otomatis: dipanggil dari simpanPerangkat() setiap data berubah,
         di-debounce 3 detik, dan dilewati bila isi data sama persis dengan
         yang terakhir tersimpan di cloud. */
      function jadwalkanCloudSave() {
        if (!cloudTerhubung() || cloudSuppressSave || cloudBootPending) return;
        if (JSON.stringify(cloudPayload()) === cloudLastSentStr) return;
        if (cloudTimer) clearTimeout(cloudTimer);
        cloudTimer = setTimeout(function () { cloudTimer = null; cloudSave(); }, 3000);
      }
      /* Hubungkan pertama kali: uji ping, lalu periksa isi cloud. Bila cloud
         kosong → arahkan unggah. Bila cloud berisi dan perangkat ini juga
         berisi data yang berbeda → pengguna memilih lewat modal dalam
         halaman (dialog konfirmasi bawaan browser tidak berfungsi di dalam
         bingkai aplikasi ini). Bila perangkat ini kosong → langsung unduh. */
      function cloudHubungkan() {
        var token = (ui.cloudToken || "").trim();
        if (!token) {
          ui.cloudErr = "Isi dulu Token sinkronisasinya."; ui.cloudMsg = ""; render(); return;
        }
        cloud.url = CLOUD_ENDPOINT; cloud.token = token; simpanCloudCfg();
        ui.cloudErr = ""; ui.cloudMsg = "Menghubungi server cloud…"; cloudState = "proses"; render();
        cloudGet("ping").then(function (res) {
          if (!res || !res.ok) {
            cloudState = "galat"; ui.cloudErr = cloudErrText(res); ui.cloudMsg = ""; render(); return;
          }
          ui.cloudMsg = "Koneksi berhasil (" + (res.service || "si-rt-rw-sync") + "). Memeriksa data cloud…";
          render();
          cloudGet("load").then(function (lr) {
            if (!lr || !lr.ok) {
              cloudState = "galat"; ui.cloudErr = cloudErrText(lr); ui.cloudMsg = ""; render(); return;
            }
            if (lr.deviceId) cloudLastDevice = String(lr.deviceId);
            if (!lr.exists) {
              cloudState = "tersinkron";
              cloud.lastSyncAt = new Date().toISOString(); simpanCloudCfg();
              ui.cloudMsg = "Terhubung. Cloud masih kosong — tekan \u201CUnggah Data Perangkat Ini ke Cloud\u201D untuk menyimpan data perangkat ini ke Turso.";
              ui.cloudErr = ""; render(); return;
            }
            cloudLastSentStr = JSON.stringify(cloudPayloadFrom(lr.state));
            if (lr.updatedAt && lr.updatedAt === String(cloud.lastKnownUpdatedAt || "")) {
              cloudState = "tersinkron";
              cloud.lastSyncAt = new Date().toISOString(); simpanCloudCfg();
              ui.cloudMsg = "Terhubung — data perangkat ini sudah sama dengan data cloud.";
              ui.cloudErr = ""; render(); return;
            }
            if (cloudAdaDataLokal()) {
              cloudPending = lr; ui.cloudConfirm = true;
              ui.cloudMsg = ""; ui.cloudErr = ""; render(); return;
            }
            cloud.lastKnownUpdatedAt = lr.updatedAt;
            if (terapkanStateCloud(lr.state)) {
              cloud.lastSyncAt = new Date().toISOString(); simpanCloudCfg();
              cloudState = "tersinkron";
              ui.cloudMsg = "Terhubung — data dari cloud sudah diunduh ke perangkat ini.";
              ui.cloudErr = "";
            } else {
              cloudState = "galat";
              ui.cloudErr = "Data dari cloud tidak valid — data perangkat ini tidak diubah.";
              ui.cloudMsg = "";
            }
            render();
          }).catch(function () {
            cloudState = "offline"; ui.cloudErr = "";
            ui.cloudMsg = "Offline — tidak dapat memeriksa data cloud. Data perangkat tetap aman.";
            render();
          });
        }).catch(function () {
          cloudState = "offline"; ui.cloudErr = "";
          ui.cloudMsg = "Offline — tidak dapat menghubungi server cloud. Periksa koneksi internet lalu coba lagi.";
          render();
        });
      }
      function viewCloudSync() {
        var terhubung = cloudTerhubung();
        var statusTeks = !terhubung ? "Belum terhubung"
          : cloudState === "offline" ? "Offline — data tersimpan di perangkat, akan disinkronkan nanti"
          : cloudState === "proses" ? "Sedang menyinkronkan…"
          : cloudState === "galat" ? "Terhubung — sinkron terakhir bermasalah, lihat pesan di bawah"
          : "Terhubung";
        return '<section class="card"><h2 class="sec">Sinkronisasi Cloud (Turso)</h2>' +
          '<p class="sub">Hubungkan aplikasi ini ke database Turso milik RT: seluruh data tersimpan di database Turso, sehingga data yang sama bisa dipakai bergantian di banyak perangkat. Token hanya disimpan di perangkat ini, tidak ikut tersinkron. Data juga tetap tersimpan lokal sebagai cadangan — saat offline aplikasi tetap berjalan dan menyinkronkan lagi begitu online. Setiap perubahan data terunggah otomatis beberapa detik setelah disimpan.</p>' +
          '<div style="margin-top:.75rem">' +
          '<div><label class="lbl" for="cloud-token">Token sinkronisasi</label>' +
          '<input id="cloud-token" type="password" autocomplete="off" class="inp" placeholder="token sinkronisasi (env SYNC_TOKEN di Vercel)" value="' + esc(ui.cloudToken || "") + '" data-bind="cloudToken"></div></div>' +
          '<div class="list" style="margin-top:.75rem">' +
          '<div class="row-item"><div><p class="t">Status koneksi</p><p class="s">' + esc(statusTeks) + '</p></div></div>' +
          '<div class="row-item"><div><p class="t">Terakhir sinkron</p><p class="s">' +
            (cloud.lastSyncAt ? esc(new Date(cloud.lastSyncAt).toLocaleString("id-ID")) : "Belum pernah") + '</p></div></div>' +
          '<div class="row-item"><div><p class="t">Perangkat terakhir mengubah</p><p class="s">' +
            (cloudLastDevice ? esc(cloudLastDevice) + (cloudLastDevice === cloud.deviceId ? " (perangkat ini)" : "") : "—") + '</p></div></div>' +
          '<div class="row-item"><div><p class="t">Jumlah baris data perangkat ini</p><p class="s num">' +
            cloudJumlahBaris() + " baris dari " + LS_FIELDS.length + ' daftar data</p></div></div>' +
          "</div>" +
          (ui.cloudErr ? '<p class="field-err">' + esc(ui.cloudErr) + "</p>" : "") +
          (ui.cloudMsg ? '<p class="ok-note">' + esc(ui.cloudMsg) + "</p>" : "") +
          '<div class="actions-row">' +
          '<button type="button" class="btn btn-primary" data-act="cloud-connect">Hubungkan &amp; Uji Koneksi</button>' +
          '<button type="button" class="btn btn-ghost" data-act="cloud-upload">Unggah Data Perangkat Ini ke Cloud</button>' +
          '<button type="button" class="btn btn-ghost" data-act="cloud-download">Unduh Data dari Cloud</button>' +
          (terhubung ? '<button type="button" class="btn btn-danger-ghost" data-act="cloud-disconnect">Putuskan Cloud</button>' : "") +
          "</div></section>";
      }
      function viewCloudConfirm() {
        return '<div class="modal-overlay"><div class="modal-card">' +
          '<h2 class="sec">Data cloud dan data perangkat ini berbeda</h2>' +
          '<p class="sub">Di Turso sudah tersimpan data' +
            (cloudLastDevice ? " (terakhir diubah oleh perangkat " + esc(cloudLastDevice) + ")" : "") +
            ", dan perangkat ini juga berisi data. Pilih data mana yang dipakai — data yang tidak dipilih akan tertimpa:</p>" +
          '<div class="actions-row" style="flex-direction:column;align-items:stretch">' +
          '<button type="button" class="btn btn-primary" data-act="cloud-confirm-cloud">Pakai data cloud (timpa perangkat ini)</button>' +
          '<button type="button" class="btn btn-ghost" data-act="cloud-confirm-local">Pakai data perangkat ini (timpa cloud)</button>' +
          '<button type="button" class="btn btn-ghost" data-act="cloud-confirm-close">Nanti saja</button>' +
          "</div></div></div>";
      }

      function nextId() { return state.seq++; }
      function houseById(id) {
        for (var i = 0; i < state.houses.length; i++) if (state.houses[i].id === id) return state.houses[i];
        return null;
      }
      function sortedHouses() {
        return state.houses.slice().sort(function (a, b) {
          return String(a.nomor).localeCompare(String(b.nomor), "id", { numeric: true });
        });
      }
      function activeCols() { return state.collections.filter(function (c) { return c.status !== "batal"; }); }
      function activeExps() { return state.expenses.filter(function (e) { return e.status === "aktif"; }); }
      function pendingCount() { return state.collections.filter(function (c) { return c.status === "menunggu"; }).length; }
      function logAudit(aksi) {
        state.audit.unshift({
          id: nextId(), waktu: new Date().toLocaleString("id-ID"),
          peran: ROLE_LABEL[state.role] || state.role,
          nama: state.nama.trim() || "(tanpa nama)", aksi: aksi
        });
        if (state.audit.length > 200) state.audit.length = 200;
      }
      function wargaById(id) {
        for (var i = 0; i < state.warga.length; i++) if (state.warga[i].id === id) return state.warga[i];
        return null;
      }
      function asetById(id) {
        for (var i = 0; i < state.aset.length; i++) if (state.aset[i].id === id) return state.aset[i];
        return null;
      }
      function iuranOf(wargaId, bulan) {
        for (var i = 0; i < state.iuran.length; i++) {
          if (state.iuran[i].wargaId === wargaId && state.iuran[i].bulan === bulan) return state.iuran[i];
        }
        return null;
      }
      function profilById(id) {
        for (var i = 0; i < state.profil.length; i++) if (state.profil[i].id === id) return state.profil[i];
        return null;
      }
      function waNum(noHp) {
        var d = String(noHp || "").replace(/[^0-9]/g, "");
        if (d.indexOf("0") === 0) d = "62" + d.slice(1);
        return d;
      }
      function umurDari(tgl) {
        if (!tgl) return null;
        var b = new Date(tgl + "T00:00:00"), n = new Date();
        var u = n.getFullYear() - b.getFullYear();
        if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) u--;
        return u < 0 ? null : u;
      }
      function rtEntry(nama) {
        var list = state.settings.rtList || [];
        for (var i = 0; i < list.length; i++) if (list[i].nama === nama) return list[i];
        return null;
      }
      function nominalRumah(h) {
        var e = h && h.rt ? rtEntry(h.rt) : null;
        return e && e.nominalJimpitan > 0 ? e.nominalJimpitan : state.settings.nominalBaku;
      }
      function nominalIuranWarga(w) {
        var e = w && w.rt ? rtEntry(w.rt) : null;
        return e && e.nominalIuran >= 0 ? e.nominalIuran : (state.settings.nominalIuran || 20000);
      }
      function profilAktif() {
        return state.profil.filter(function (p) { return (p.statusTinggal || "aktif") === "aktif"; });
      }
      /* Bukti transfer dihitung "menunggu verifikasi" HANYA bila belum diputuskan
         DAN bulan itu belum tercatat lunas. Tanpa cek iuran ini, pembayaran yang
         sudah lunas (mis. bendahara menandai lunas langsung dari ceklis iuran)
         tetap dihitung lonceng sebagai menunggu — angka lonceng bertentangan
         dengan status warga & dashboard. */
      function bayarMenunggu(b) {
        return b.status === "menunggu" && !iuranOf(b.wargaId, b.bulan);
      }
      function pendingBayar() { return state.bayar.filter(bayarMenunggu); }
      function notifItems() {
        var items = [];
        state.aduan.forEach(function (a) {
          if (a.status === "Baru") items.push({ label: "Pengaduan baru dari " + a.nama + ": " + a.isi, tab: "rtrw", sec: "aduan" });
        });
        state.surat.forEach(function (s) {
          if (s.status === "Diajukan") items.push({ label: "Permohonan surat " + s.jenis + " a.n. " + s.namaPemohon, tab: "rtrw", sec: "surat" });
        });
        state.collections.forEach(function (c) {
          if (c.status === "menunggu") items.push({ label: "Setoran " + colRowHouse(c) + " (" + fmtSingkat(c.tanggal) + ") menunggu verifikasi", tab: "keliling", sec: "" });
        });
        state.bayar.forEach(function (b) {
          if (bayarMenunggu(b)) {
            var w = wargaById(b.wargaId);
            items.push({ label: "Bukti transfer iuran " + fmtBulan(b.bulan) + " dari " + (w ? w.nama : "?") + " menunggu verifikasi", tab: "rtrw", sec: "iuran" });
          }
        });
        return items;
      }

      function dashboard() {
        var today = todayStr();
        var cols = activeCols(), exps = activeExps();
        var totalMasuk = 0, totalJimpitan = 0, totalKelebihan = 0, totalKeluar = 0;
        cols.forEach(function (c) { totalMasuk += c.total; totalJimpitan += c.jimpitan; totalKelebihan += c.kelebihan; });
        var totalIuran = state.iuran.reduce(function (s, i) { return s + (Number(i.jumlah) || 0); }, 0);

        harian.forEach(function (h, i) {

          out += '<rect class="bar' + (h.total === 0 ? " zero" : "") + '" x="' + x.toFixed(1) +

            '" rx="3"><title>' + esc(fmtSingkat(h.tanggal)) + ": " + esc(rp(h.total)) + "</title></rect>";
          if (i % 2 === 0 || i === harian.length - 1) {
            out += '<text x="' + (i * bw + bw / 2).toFixed(1) + '" y="' + (base + 14) +
              '" text-anchor="middle">' + esc(fmtSingkat(h.tanggal)) + "</text>";

      function demografiGroups() {
        var aktif = profilAktif();
        function grup(judul, labels, fn) {
          var counts = {};
          labels.forEach(function (l) { counts[l] = 0; });
          aktif.forEach(function (p) {
            var v = fn(p);
            if (v == null || v === "") v = "(belum diisi)";
            if (!(v in counts)) counts[v] = 0;
            counts[v]++;
          });
          var items = Object.keys(counts).map(function (k) { return { label: k, jumlah: counts[k] }; })
            .sort(function (a, b) { return b.jumlah - a.jumlah; });
          return { judul: judul, items: items };
        }
        var usiaLabels = ["0–5 th", "6–12 th", "13–17 th", "18–25 th", "26–40 th", "41–55 th", "56–65 th", "di atas 65 th"];
        return [
          grup("Usia", usiaLabels, function (p) {
            var u = umurDari(p.tanggalLahir);
            if (u == null) return null;
            if (u <= 5) return "0–5 th"; if (u <= 12) return "6–12 th"; if (u <= 17) return "13–17 th";
            if (u <= 25) return "18–25 th"; if (u <= 40) return "26–40 th"; if (u <= 55) return "41–55 th";
            if (u <= 65) return "56–65 th"; return "di atas 65 th";
          }),
          grup("Agama", [], function (p) { return p.agama; }),
          grup("Status Perkawinan", [], function (p) { return p.statusKawin; }),
          grup("Pekerjaan", [], function (p) { return p.pekerjaan; }),
          grup("Pendidikan Terakhir", [], function (p) { return p.pendidikan; }),
          grup("Golongan Darah", [], function (p) { return p.golonganDarah; })
        ];
      }

        return out + "</div>";

            esc(fmtSingkat(e.tanggal)) + " · dicatat " + esc(e.dicatatOleh) + '</p></div><p class="amt num" style="color:var(--danger)">−' +

        }

        return html;
      }

      /* ================= Keliling ================= */
      function daySheet(tanggal) {
        var nominal = state.settings.nominalBaku;
        var rows = sortedHouses().filter(function (h) { return h.status !== "nonaktif"; }).map(function (h) {
          var found = null;
          state.collections.forEach(function (c) {
            if (c.houseId === h.id && c.tanggal === tanggal && c.status !== "batal") found = c;
          });
          return { house: h, collection: found, nominal: nominalRumah(h) };
        });
        var total = 0, kelebihan = 0, sudah = 0, menunggu = 0;
        rows.forEach(function (r) {
          if (r.collection) {
            total += r.collection.total; kelebihan += r.collection.kelebihan; sudah++;
            if (r.collection.status === "menunggu") menunggu++;
          }
        });
        return { nominalBaku: nominal, rows: rows, summary: { totalTerkumpul: total, totalKelebihan: kelebihan, sudahSetor: sudah, menungguVerifikasi: menunggu } };
      }

            '<p style="margin:0;font-weight:700">Rumah ' + esc(h.nomor) +
            (h.blok ? ' <span style="font-weight:600;color:var(--dim)">· Blok ' + esc(h.blok) + "</span>" : "") + "</p>" +
            '<p class="s" style="font-size:.875rem;color:var(--dim);margin:0">' + esc(h.namaPenghuni) + "</p>" +

              '<input id="batal-' + c.id + '" type="text" class="inp" placeholder="mis. salah catat nominal" value="' +

          }
          html += "</div>";

        html += "</div></div>";
        return html;
      }

      /* ================= Laporan ================= */
      function reportData(bulan) {
        var cols = activeCols().filter(function (c) { return c.tanggal.indexOf(bulan) === 0; });
        var exps = activeExps().filter(function (e) { return e.tanggal.indexOf(bulan) === 0; });
        var perRumah = sortedHouses().map(function (h) {
          var mine = cols.filter(function (c) { return c.houseId === h.id; });
          var hariSetor = {};
          mine.forEach(function (c) { hariSetor[c.tanggal] = true; });
          return {
            house: h,
            hariSetor: Object.keys(hariSetor).length,
            jimpitan: mine.reduce(function (s, c) { return s + c.jimpitan; }, 0),
            kelebihan: mine.reduce(function (s, c) { return s + c.kelebihan; }, 0),
            total: mine.reduce(function (s, c) { return s + c.total; }, 0)
          };
        });
        var totalMasuk = cols.reduce(function (s, c) { return s + c.total; }, 0);
        var totalKeluar = exps.reduce(function (s, e) { return s + e.jumlah; }, 0);
        return {
          ringkasan: {
            totalMasuk: totalMasuk,
            totalJimpitan: cols.reduce(function (s, c) { return s + c.jimpitan; }, 0),
            totalKelebihan: cols.reduce(function (s, c) { return s + c.kelebihan; }, 0),
            totalKeluar: totalKeluar,
            saldoBulan: totalMasuk - totalKeluar,
            jumlahSetoran: cols.length
          },
          perRumah: perRumah
        };
      }

        var r = reportData(ui.bulan);

        var lines = [

          "",

        ];
        r.perRumah.forEach(function (p) {
          lines.push([p.house.nomor, p.house.namaPenghuni, p.hariSetor, p.jimpitan, p.kelebihan, p.total].map(q).join(","));
        });
        downloadFile("laporan-jimpitan-" + ui.bulan + ".csv", lines.join("\n"), "text/csv;charset=utf-8");

      function parseCsv(text) {
        var delim = text.indexOf(";") >= 0 && text.indexOf(",") < 0 ? ";" : (text.split("\n")[0].indexOf(";") > text.split("\n")[0].indexOf(",") ? ";" : ",");
        var rows = [], row = [], cur = "", inQ = false;
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          if (inQ) {
            if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
            else cur += ch;
          } else if (ch === '"') inQ = true;
          else if (ch === delim) { row.push(cur.trim()); cur = ""; }
          else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && text[i + 1] === "\n") i++;
            row.push(cur.trim()); cur = "";
            if (row.length > 1 || row[0] !== "") rows.push(row);
            row = [];
          } else cur += ch;
        }
        row.push(cur.trim());
        if (row.length > 1 || row[0] !== "") rows.push(row);
        return rows;
      }
