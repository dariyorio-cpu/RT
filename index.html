          var j = Number(ui.eJumlah);
          if (!isFinite(j) || j < 1) { ui.eError = "Jumlah harus angka lebih dari 0."; render(); return; }
          state.expenses.push({
            id: nextId(), tanggal: ui.eTgl || todayStr(), keperluan: ui.eKeperluan.trim(),
            jumlah: Math.round(j), dicatatOleh: state.nama.trim(),
            keterangan: ui.eKet.trim(), status: "aktif", alasanBatal: "", kas: ui.eKas || "utama"
          });
          logAudit("Pengeluaran dicatat: " + ui.eKeperluan.trim() + " " + rp(Math.round(j)) + " dari " +
            (ui.eKas === "proyek" ? "Kas Proyek/Kegiatan" : ui.eKas === "kematian" ? "Kas Kematian" : "Kas Utama") + ".");
          ui.eKeperluan = ""; ui.eJumlah = ""; ui.eKet = ""; ui.eError = ""; ui.error = "";
          render();
        }
        else if (kind === "rt-warga") {
          if (!canKelola()) { ui.rtError = "Data warga hanya dikelola Bendahara dan Super Admin."; ui.rtDone = ""; render(); return; }
          if (!ui.wNama.trim()) { ui.rtError = "Nama kepala keluarga wajib diisi."; ui.rtDone = ""; render(); return; }
          if (!ui.wAlamat.trim()) { ui.rtError = "Alamat / nomor rumah wajib diisi."; ui.rtDone = ""; render(); return; }
          if (ui.wEdit) {
            var ew = wargaById(ui.wEdit);
            if (ew) {
              ew.nama = ui.wNama.trim(); ew.alamat = ui.wAlamat.trim(); ew.noHp = ui.wHp.trim();
              ew.status = ui.wStatus || "aktif"; ew.rt = ui.wRt || "";
              logAudit("Data warga/KK diubah: " + ew.nama + " (status " + ew.status + ").");
            }
            ui.wEdit = null;
            ui.rtDone = "Data warga diperbarui.";
          } else {
            state.warga.push({ id: nextId(), nama: ui.wNama.trim(), alamat: ui.wAlamat.trim(), noHp: ui.wHp.trim(), status: ui.wStatus || "aktif", rt: ui.wRt || "" });
            logAudit("Data warga/KK ditambah: " + ui.wNama.trim() + " (" + ui.wAlamat.trim() + ").");
            ui.rtDone = "Data warga tersimpan.";
          }
          ui.wNama = ""; ui.wAlamat = ""; ui.wHp = ""; ui.wStatus = "aktif"; ui.wRt = "";
          ui.rtError = ""; render();
        }
        else if (kind === "rt-profil") {
          if (!canKelola()) { ui.rtError = "Profil Warga hanya dikelola Bendahara dan Super Admin."; ui.rtDone = ""; render(); return; }
          if (!ui.pfNama.trim()) { ui.rtError = "Nama warga wajib diisi."; ui.rtDone = ""; render(); return; }
          var nik = ui.pfNik.trim();
          if (nik) {
            var dupNik = state.profil.some(function (p) { return p.nik === nik && p.id !== ui.pfEdit; });
            if (dupNik) { ui.rtError = "NIK " + nik + " sudah terdaftar atas nama warga lain — NIK harus unik, periksa kembali."; ui.rtDone = ""; render(); return; }
          }
          if ((ui.pfStatus === "pindah" || ui.pfStatus === "meninggal") && !ui.pfAlasan.trim()) {
            ui.rtError = "Alasan wajib diisi bila status Pindah atau Meninggal."; ui.rtDone = ""; render(); return;
          }
          var olehNama = state.nama.trim() || ROLE_LABEL[state.role];
          if (ui.pfEdit) {
            var ep = profilById(ui.pfEdit);
            if (ep) {
              var statusLama = ep.statusTinggal || "aktif";
              ep.houseId = ui.pfHouse ? Number(ui.pfHouse) : null;
              ep.noKK = ui.pfKK.trim(); ep.nik = nik; ep.nama = ui.pfNama.trim();
              ep.hubungan = ui.pfHub; ep.pekerjaan = ui.pfPekerjaan.trim();
              ep.pendidikan = ui.pfPendidikan; ep.golonganDarah = ui.pfDarah;
              ep.tanggalLahir = ui.pfLahir; ep.agama = ui.pfAgama; ep.statusKawin = ui.pfKawin;
              ep.noHp = ui.pfHp.trim(); ep.statusTinggal = ui.pfStatus;
              if (statusLama !== ui.pfStatus) {
                ep.riwayat = ep.riwayat || [];
                ep.riwayat.push({ status: ui.pfStatus === "aktif" ? "Aktif kembali" : ui.pfStatus === "pindah" ? "Pindah" : "Meninggal", tanggal: todayStr(), alasan: ui.pfAlasan.trim(), oleh: olehNama });
              }
              logAudit("Profil warga diubah: " + ep.nama + (statusLama !== ui.pfStatus ? " — status " + statusLama + " → " + ui.pfStatus + (ui.pfAlasan.trim() ? " (" + ui.pfAlasan.trim() + ")" : "") : "") + ".");
            }
            ui.rtDone = "Profil warga diperbarui.";
          } else {
            var np = {
              id: nextId(), houseId: ui.pfHouse ? Number(ui.pfHouse) : null,
              noKK: ui.pfKK.trim(), nik: nik, nama: ui.pfNama.trim(), hubungan: ui.pfHub,
              pekerjaan: ui.pfPekerjaan.trim(), pendidikan: ui.pfPendidikan, golonganDarah: ui.pfDarah,
              tanggalLahir: ui.pfLahir, agama: ui.pfAgama, statusKawin: ui.pfKawin,
              noHp: ui.pfHp.trim(), statusTinggal: ui.pfStatus, riwayat: []
            };
            if (ui.pfStatus !== "aktif") {
              np.riwayat.push({ status: ui.pfStatus === "pindah" ? "Pindah" : "Meninggal", tanggal: todayStr(), alasan: ui.pfAlasan.trim(), oleh: olehNama });
            }
            state.profil.push(np);
            logAudit("Profil warga ditambah: " + np.nama + " (" + np.hubungan + ", KK " + (np.noKK || "-") + ").");
            ui.rtDone = "Profil warga tersimpan.";
          }
          resetProfilForm();
          ui.rtError = ""; render();
        }
        else if (kind === "rt-batal") {
          if (!canKelola()) return;
          if (!ui.batalReason.trim()) { ui.rtError = "Alasan pembatalan wajib diisi."; ui.rtDone = ""; render(); return; }
          var koleksi = { aset: state.aset, agenda: state.agenda, umum: state.umum, umkm: state.umkm }[ui.batalJenis];
          var labelB = { aset: "Aset", agenda: "Agenda", umum: "Pengumuman", umkm: "UMKM" }[ui.batalJenis];
          if (koleksi) {
            koleksi.forEach(function (x) {
              if (x.id === ui.batalId) {
                x.status = "batal"; x.alasanBatal = ui.batalReason.trim();
                logAudit(labelB + " dibatalkan: " + (x.nama || x.judul || x.namaUsaha || x.id) + " — alasan: " + ui.batalReason.trim() + ".");
              }
            });
          }
          ui.batalJenis = ""; ui.batalId = null; ui.batalReason = "";
          ui.rtError = ""; ui.rtDone = labelB + " dibatalkan dengan alasan tercatat — tidak dihapus permanen."; render();
        }
        else if (kind === "house-arsip") {
          if (!canKelola()) return;
          if (!ui.houseArsipReason.trim()) { ui.error = "Alasan mengarsipkan rumah wajib diisi."; render(); return; }
          var ha = houseById(Number(form.getAttribute("data-id")));
          if (ha) {
            ha.status = "nonaktif";
            ha.catatan = ((ha.catatan ? ha.catatan + " · " : "") + "Diarsipkan: " + ui.houseArsipReason.trim());
            logAudit("Data rumah diarsipkan: Rumah " + ha.nomor + " (" + ha.namaPenghuni + ") — alasan: " + ui.houseArsipReason.trim() + ".");
          }
          ui.houseArsipFor = null; ui.houseArsipReason = ""; ui.error = "";
          render();
        }
        else if (kind === "my-login") {
          var namaIn = ui.myNama.trim().toLowerCase(), hpIn = waNum(ui.myHp);
          var found = null;
          state.warga.forEach(function (w) {
            if (found) return;
            var namaCocok = w.nama.toLowerCase() === namaIn;
            var hpCocok = !w.noHp || waNum(w.noHp) === hpIn;
            if (namaIn && namaCocok && hpCocok) found = w;
          });
          if (!found) {
            ui.myErr = "Data tidak ditemukan. Pastikan nama kepala keluarga dan nomor HP sama persis dengan catatan pengurus — atau minta pengurus memeriksa data Warga & KK Anda.";
            ui.myMsg = ""; render(); return;
          }
          ui.myWargaId = found.id; ui.myErr = ""; ui.myMsg = "";
          render();
        }
        else if (kind === "my-pay") {
          var me2 = wargaById(ui.myWargaId);
          if (!me2 || !ui.myBulan) { ui.myErr = "Sesi warga tidak ditemukan — masuk lagi."; render(); return; }
          var jml = Number(ui.myJumlah);
          if (!isFinite(jml) || jml < 1) { ui.myErr = "Jumlah transfer harus angka lebih dari 0."; render(); return; }
          if (!ui.myBuktiNama) { ui.myErr = "Lampirkan dulu bukti transfernya (pilih berkas foto/struk)."; render(); return; }
          state.bayar.push({
            id: nextId(), wargaId: me2.id, bulan: ui.myBulan, jumlah: Math.round(jml),
            buktiNama: ui.myBuktiNama, keterangan: ui.myKet.trim(), tanggal: todayStr(), status: "menunggu"
          });
          logAudit("Pembayaran iuran mandiri masuk: " + me2.nama + ", " + fmtBulan(ui.myBulan) + ", " + rp(Math.round(jml)) + " — menunggu verifikasi bendahara.");
          ui.myMsg = "Bukti terkirim untuk iuran " + fmtBulan(ui.myBulan) + " — status Menunggu verifikasi bendahara.";
          ui.myErr = ""; ui.myBulan = ""; ui.myBuktiNama = ""; ui.myKet = "";
          render();
        }
        else if (kind === "rt-add") {
          if (!isSuper()) { ui.sError = "Daftar RT hanya dikelola Super Admin."; render(); return; }
          var rtn2 = ui.rtNamaBaru.trim();
          var rtj = Number(ui.rtJimpBaru), rti = Number(ui.rtIuranBaru);
          if (!rtn2) { ui.sError = "Nama RT wajib diisi."; ui.sDone = false; render(); return; }
          if (rtEntry(rtn2)) { ui.sError = "RT " + rtn2 + " sudah ada di daftar."; ui.sDone = false; render(); return; }
          if (!isFinite(rtj) || rtj < 100) { ui.sError = "Nominal jimpitan RT minimal Rp100."; ui.sDone = false; render(); return; }
          if (!isFinite(rti) || rti < 0) { ui.sError = "Nominal iuran RT tidak valid."; ui.sDone = false; render(); return; }
          state.settings.rtList = state.settings.rtList || [];
          state.settings.rtList.push({ nama: rtn2, nominalJimpitan: Math.round(rtj), nominalIuran: Math.round(rti) });
          logAudit("RT ditambahkan ke daftar RW: " + rtn2 + " (jimpitan " + rp(Math.round(rtj)) + ", iuran " + rp(Math.round(rti)) + ").");
          ui.rtNamaBaru = ""; ui.rtJimpBaru = ""; ui.rtIuranBaru = "";
          ui.sError = ""; ui.sDone = true;
          render();
        }
        else if (kind === "pengurus-add") {
          if (!isSuper()) { ui.sError = "Daftar pengurus hanya dikelola Super Admin."; render(); return; }
          if (!ui.pgNama.trim()) { ui.sError = "Nama pengurus wajib diisi."; ui.sDone = false; render(); return; }
          if (!ui.pgJabatan.trim()) { ui.sError = "Jabatan pengurus wajib diisi."; ui.sDone = false; render(); return; }
          state.settings.pengurus = state.settings.pengurus || [];
          state.settings.pengurus.push({ nama: ui.pgNama.trim(), jabatan: ui.pgJabatan.trim(), noHp: ui.pgHp.trim(), foto: ui.pgFoto || "" });
          logAudit("Pengurus halaman depan ditambah: " + ui.pgNama.trim() + " (" + ui.pgJabatan.trim() + ").");
          ui.pgNama = ""; ui.pgJabatan = ""; ui.pgHp = ""; ui.pgFoto = "";
          ui.sError = ""; ui.sDone = true;
          render();
        }
        else if (kind === "rt-aset") {
          if (!canKelola()) { ui.rtError = "Aset hanya dikelola Bendahara dan Super Admin."; ui.rtDone = ""; render(); return; }
          var aj = Number(ui.aJumlah);
          if (!ui.aNama.trim()) { ui.rtError = "Nama aset wajib diisi."; ui.rtDone = ""; render(); return; }
          if (!isFinite(aj) || aj < 1) { ui.rtError = "Jumlah aset minimal 1."; ui.rtDone = ""; render(); return; }
          if (ui.aEdit) {
            var ea = asetById(ui.aEdit);
            if (ea) {
              ea.nama = ui.aNama.trim(); ea.jumlah = Math.round(aj);
              ea.kondisi = ui.aKondisi.trim() || "Baik"; ea.lokasi = ui.aLokasi.trim();
              logAudit("Aset diubah: " + ea.nama + " ×" + ea.jumlah + " (" + ea.kondisi + ").");
            }
            ui.aEdit = null; ui.rtDone = "Aset diperbarui.";
          } else {
            state.aset.push({ id: nextId(), nama: ui.aNama.trim(), jumlah: Math.round(aj), kondisi: ui.aKondisi.trim() || "Baik", lokasi: ui.aLokasi.trim(), status: "aktif", alasanBatal: "" });
            logAudit("Aset ditambah: " + ui.aNama.trim() + " ×" + Math.round(aj) + ".");
            ui.rtDone = "Aset tersimpan.";
          }
          ui.aNama = ""; ui.aJumlah = "1"; ui.aLokasi = "";
          ui.rtError = ""; render();
        }
        else if (kind === "rt-surat") {
          if (!ui.suNama.trim()) { ui.rtError = "Nama pemohon wajib diisi."; ui.rtDone = ""; render(); return; }
          state.surat.push({ id: nextId(), namaPemohon: ui.suNama.trim(), jenis: ui.suJenis, keperluan: ui.suKeperluan.trim(), tanggal: todayStr(), status: "Diajukan", catatan: "" });
          logAudit("Pengajuan surat " + ui.suJenis + " a.n. " + ui.suNama.trim() + ".");
          ui.suNama = ""; ui.suKeperluan = "";
          ui.rtError = ""; ui.rtDone = "Pengajuan surat terkirim — status: Diajukan."; render();
        }
        else if (kind === "rt-pinjam") {
          if (!canKelola()) { ui.rtError = "Peminjaman hanya dicatat Bendahara dan Super Admin."; ui.rtDone = ""; render(); return; }
          var pa = asetById(Number(ui.pjAset));
          if (!pa) { ui.rtError = "Pilih aset dulu — tambahkan aset di subtab Aset bila belum ada."; ui.rtDone = ""; render(); return; }
          if (!ui.pjNama.trim()) { ui.rtError = "Nama peminjam wajib diisi."; ui.rtDone = ""; render(); return; }
          state.pinjam.push({ id: nextId(), asetId: pa.id, peminjam: ui.pjNama.trim(), tanggalPinjam: ui.pjTgl || todayStr(), tanggalKembali: "", status: "dipinjam" });
          logAudit("Peminjaman dicatat: " + pa.nama + " oleh " + ui.pjNama.trim() + ".");
          ui.pjNama = "";
          ui.rtError = ""; ui.rtDone = "Peminjaman tercatat."; render();
        }
        else if (kind === "rt-aduan") {
          if (!ui.adNama.trim()) { ui.rtError = "Nama pengaju wajib diisi."; ui.rtDone = ""; render(); return; }
          if (!ui.adIsi.trim()) { ui.rtError = "Isi pengaduan wajib diisi."; ui.rtDone = ""; render(); return; }
          state.aduan.push({ id: nextId(), nama: ui.adNama.trim(), isi: ui.adIsi.trim(), tanggal: todayStr(), status: "Baru" });
          logAudit("Pengaduan baru dari " + ui.adNama.trim() + ".");
          ui.adNama = ""; ui.adIsi = "";
          ui.rtError = ""; ui.rtDone = "Pengaduan terkirim — status: Baru."; render();
        }
        else if (kind === "rt-agenda") {
          if (!canKelola()) { ui.rtError = "Agenda hanya dikelola Bendahara dan Super Admin."; ui.rtDone = ""; render(); return; }
          if (!ui.agJudul.trim()) { ui.rtError = "Judul kegiatan wajib diisi."; ui.rtDone = ""; render(); return; }
          if (ui.agEdit) {
            state.agenda.forEach(function (x) {
              if (x.id === ui.agEdit) {
                x.judul = ui.agJudul.trim(); x.tanggal = ui.agTgl || todayStr();
                x.lokasi = ui.agLokasi.trim(); x.keterangan = ui.agKet.trim();
                logAudit("Agenda diubah: " + x.judul + " (" + x.tanggal + ").");
              }
            });
            ui.agEdit = null; ui.rtDone = "Agenda diperbarui.";
          } else {
            state.agenda.push({ id: nextId(), judul: ui.agJudul.trim(), tanggal: ui.agTgl || todayStr(), lokasi: ui.agLokasi.trim(), keterangan: ui.agKet.trim(), status: "aktif", alasanBatal: "" });
            logAudit("Agenda ditambah: " + ui.agJudul.trim() + " (" + (ui.agTgl || todayStr()) + ").");
            ui.rtDone = "Agenda tersimpan.";
          }
          ui.agJudul = ""; ui.agLokasi = ""; ui.agKet = "";
          ui.rtError = ""; render();
        }
        else if (kind === "rt-umum") {
          if (!canKelola()) { ui.rtError = "Pengumuman hanya diterbitkan Bendahara dan Super Admin."; ui.rtDone = ""; render(); return; }
          if (!ui.umJudul.trim()) { ui.rtError = "Judul pengumuman wajib diisi."; ui.rtDone = ""; render(); return; }
          if (ui.umEdit) {
            state.umum.forEach(function (x) {
              if (x.id === ui.umEdit) {
                x.judul = ui.umJudul.trim(); x.isi = ui.umIsi.trim();
                logAudit("Pengumuman diubah: " + x.judul + ".");
              }
            });
            ui.umEdit = null; ui.rtDone = "Pengumuman diperbarui.";
          } else {
            state.umum.push({ id: nextId(), judul: ui.umJudul.trim(), isi: ui.umIsi.trim(), tanggal: todayStr(), status: "aktif", alasanBatal: "" });
            logAudit("Pengumuman diterbitkan: " + ui.umJudul.trim() + ".");
            ui.rtDone = "Pengumuman diterbitkan — juga tampil di Beranda.";
          }
          ui.umJudul = ""; ui.umIsi = "";
          ui.rtError = ""; render();
        }
        else if (kind === "rt-umkm") {
          if (!canKelola()) { ui.rtError = "UMKM hanya dikelola Bendahara dan Super Admin."; ui.rtDone = ""; render(); return; }
          if (!ui.ukNama.trim()) { ui.rtError = "Nama usaha wajib diisi."; ui.rtDone = ""; render(); return; }
          if (!ui.ukPemilik.trim()) { ui.rtError = "Nama pemilik wajib diisi."; ui.rtDone = ""; render(); return; }
          if (ui.ukEdit) {
            state.umkm.forEach(function (x) {
              if (x.id === ui.ukEdit) {
                x.namaUsaha = ui.ukNama.trim(); x.pemilik = ui.ukPemilik.trim();
                x.kategori = ui.ukKategori.trim(); x.kontak = ui.ukKontak.trim(); x.deskripsi = ui.ukDesk.trim();
                logAudit("UMKM diubah: " + x.namaUsaha + " (" + x.pemilik + ").");
              }
            });
            ui.ukEdit = null; ui.rtDone = "UMKM diperbarui.";
          } else {
            state.umkm.push({ id: nextId(), namaUsaha: ui.ukNama.trim(), pemilik: ui.ukPemilik.trim(), kategori: ui.ukKategori.trim(), kontak: ui.ukKontak.trim(), deskripsi: ui.ukDesk.trim(), status: "aktif", alasanBatal: "" });
            logAudit("UMKM ditambah: " + ui.ukNama.trim() + " (" + ui.ukPemilik.trim() + ").");
            ui.rtDone = "UMKM tersimpan.";
          }
          ui.ukNama = ""; ui.ukPemilik = ""; ui.ukKategori = ""; ui.ukKontak = ""; ui.ukDesk = "";
          ui.rtError = ""; render();
        }
        else if (kind === "exp-void") {
          if (!isBendahara()) return;
          if (!ui.voidExpReason.trim()) { ui.error = "Alasan pembatalan wajib diisi."; render(); return; }
          var eid = Number(form.getAttribute("data-id"));
          state.expenses.forEach(function (e) {
            if (e.id === eid) { e.status = "batal"; e.alasanBatal = ui.voidExpReason.trim(); }
          });
          ui.voidExpFor = null; ui.voidExpReason = ""; ui.error = "";
          render();
        }
      });

      muatPerangkat();
      muatCloudCfg();
      ui.cloudToken = cloud.token;
      /* Selama unduh awal dari cloud berjalan, unggah otomatis ditahan supaya
         data lokal lama tidak menimpa data cloud yang lebih baru. */
      if (cloudTerhubung()) cloudBootPending = true;
      render();
      /* Sinkron awal: unduh data cloud yang lebih baru tanpa memblokir UI.
         Bila gagal (offline), aplikasi tetap berjalan dari localStorage. */
      if (cloudTerhubung()) cloudLoad();
</script>
  </body>
</html>
